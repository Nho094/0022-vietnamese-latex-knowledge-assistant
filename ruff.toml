# Keep Ruff's standard correctness rules across maintained code. The exclusions
# cover archived v0 code; E402 is intentional where scripts add the project root
# to sys.path before project imports. E501 is handled by review, not lint here.
exclude = ["legacy/**", ".venv/**", "venv/**"]

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501", "E731", "E741"]
